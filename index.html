<!DOCTYPE html>
<html>
<head>
  <title>Big Play Button Udio</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 50px;
    }

    #player-container {
      display: none; /* Hide the player at start */
      margin-top: 20px;
    }

    #play-button {
      background: #ff4757;
      color: white;
      border: none;
      padding: 30px 60px;
      font-size: 40px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    #play-button:hover {
      background: #ff6b81;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <button id="play-button">▶ PLAY</button>

  <div id="player-container">
    <iframe 
      id="udio-player"
      src="https://www.udio.com/embed/8b6MECYAqSLp63F8DRPuFn"
      width="100%"
      height="400"
      frameborder="0"
      allow="autoplay">
    </iframe>
  </div>

  <script>
    document.getElementById("play-button").onclick = function() {
      document.getElementById("player-container").style.display = "block";
      document.getElementById("play-button").style.display = "none";
    };
  </script>

</body>
</html>
